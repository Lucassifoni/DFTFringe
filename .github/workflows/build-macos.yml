name: build-macos
on:
  push:
    branches:
      - master
      - macos-build
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # opencv pulls a large dependency tree, so this is the slowest step by far.
      # opencv@4 rather than opencv, which is now OpenCV 5, so that all three
      # platforms build against the same OpenCV major version.
      - name: Install dependencies
        run: brew install qt qwt opencv@4 armadillo

      # Homebrew lives in /usr/local on Intel and /opt/homebrew on Apple silicon,
      # and Qt6 is split across several kegs, so everything is resolved at runtime
      # rather than hard coded.
      - name: Resolve Homebrew layout
        run: |
          QT_PREFIX="$(brew --prefix qt)"
          if [ ! -x "$QT_PREFIX/bin/qmake" ]; then QT_PREFIX="$(brew --prefix qtbase)"; fi
          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix qwt)/lib/pkgconfig:$(brew --prefix opencv@4)/lib/pkgconfig:$(brew --prefix armadillo)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      # Prints everything needed to diagnose a failed configure step without
      # having to guess at the Homebrew layout from the outside.
      - name: Probe toolchain
        run: |
          echo "--- prefixes"
          for f in qt qtbase qwt opencv@4 armadillo; do
            echo "$f -> $(brew --prefix $f 2>/dev/null || echo 'NOT INSTALLED')"
          done
          echo "--- qmake"
          "$QT_PREFIX/bin/qmake" -v
          "$QT_PREFIX/bin/qmake" -query
          echo "--- qt modules visible to qmake"
          ls "$(brew --prefix)/share/qt/mkspecs/modules" 2>/dev/null | grep -iE "charts|datavis|opengl|printsupport" || echo "(module .pri files not found)"
          echo "--- pkg-config packages"
          pkg-config --list-all | grep -iE "qwt|opencv|armadillo" || echo "(no matches)"
          echo "--- pkg-config resolution"
          for p in armadillo opencv4 opencv5 Qt6Qwt6; do
            echo "$p: $(pkg-config --modversion $p 2>&1 | head -1)"
          done
          echo "--- qwt keg layout"
          find -L "$(brew --prefix qwt)" -maxdepth 3 \( -name "*.pc" -o -name "*.framework" -o -name "libqwt*" \) 2>/dev/null || true

      # Mirrors the naming used by build-windows.yml so artifacts line up.
      - name: Resolve version strings
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            WORKFLOW_VERSION="${{ github.event.pull_request.head.sha }}_${{ github.event.pull_request.base.sha }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            WORKFLOW_VERSION="${{ github.ref_name }}"
          else
            WORKFLOW_VERSION="${{ github.sha }}"
          fi
          # CFBundleShortVersionString only accepts a dotted numeric string, so a
          # commit sha cannot go there. Tags give a real version, anything else 0.0.0.
          BUNDLE_VERSION="$(printf '%s' "$WORKFLOW_VERSION" | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p')"
          if [ -z "$BUNDLE_VERSION" ]; then BUNDLE_VERSION="0.0.0"; fi
          echo "WORKFLOW_VERSION=$WORKFLOW_VERSION" >> "$GITHUB_ENV"
          echo "BUNDLE_VERSION=$BUNDLE_VERSION" >> "$GITHUB_ENV"
          echo "version=$WORKFLOW_VERSION bundle=$BUNDLE_VERSION"

      - name: Find and Replace MY_AUTOMATED_VERSION_STRING
        run: sed -i '' "s/MY_AUTOMATED_VERSION_STRING/${WORKFLOW_VERSION}/" DFTFringe.pro

      - name: Configure
        run: |
          "$QT_PREFIX/bin/qmake" DFTFringe.pro CONFIG+=release

      - uses: ammaraskar/gcc-problem-matcher@master
      - run: echo "::add-matcher::.github/matcher/uic_matcher.json"
      - name: Build
        run: make -j$(sysctl -n hw.ncpu)
      - run: echo "::remove-matcher owner=uic-problem-matcher::"

      # macdeployqt copies the Qt frameworks and the Homebrew dylibs the binary
      # references into the bundle and rewrites their install names.
      - name: Bundle dependencies
        run: |
          "$QT_PREFIX/bin/macdeployqt" build/release/DFTFringe.app -verbose=1
          # colormapviewerdlg looks for ColorMaps next to the executable.
          cp -R ColorMaps build/release/DFTFringe.app/Contents/MacOS/
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $BUNDLE_VERSION" \
            build/release/DFTFringe.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUNDLE_VERSION" \
            build/release/DFTFringe.app/Contents/Info.plist

      # Ad-hoc signature only. Without an Apple Developer ID the app cannot be
      # notarised, so users have to clear the quarantine flag themselves. See
      # "How to build DFTFringe on MacOS" in README.md.
      - name: Ad-hoc sign
        run: codesign --force --deep --sign - build/release/DFTFringe.app

      - name: Verify the bundle is self contained
        run: |
          otool -L build/release/DFTFringe.app/Contents/MacOS/DFTFringe
          echo "--- references outside the bundle and the system:"
          otool -L build/release/DFTFringe.app/Contents/MacOS/DFTFringe \
            | tail -n +2 | awk '{print $1}' \
            | grep -vE "^(@rpath|@executable_path|/usr/lib|/System)" || echo "(none)"

      - name: Create disk image
        run: |
          STAGE="$(mktemp -d)/DFTFringe"
          mkdir -p "$STAGE"
          cp -R build/release/DFTFringe.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "DFTFringe" -srcfolder "$STAGE" -ov -format UDZO \
            "DFTFringe-${WORKFLOW_VERSION}-${{ matrix.arch }}.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DFTFringe-macos-${{ matrix.arch }}-build-artifact
          path: DFTFringe-${{ env.WORKFLOW_VERSION }}-${{ matrix.arch }}.dmg
